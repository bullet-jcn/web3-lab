services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: web3_lab
      POSTGRES_USER: web3_lab
      POSTGRES_PASSWORD: local_web3_lab_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web3_lab -d web3_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - web3_lab_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - web3_lab_redis:/data

volumes:
  web3_lab_postgres:
  web3_lab_redis:
